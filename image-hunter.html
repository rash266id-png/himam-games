<style>:root{--p:#6b2183;--a:#f6b800;--ok:#1aa865;--bad:#e2574c;--ink:#1d1630;--card:rgba(255,255,255,.94);--glass:rgba(255,255,255,.18);--fs-q:clamp(22px,3.4vmin + 8px,40px);--fs-o:clamp(20px,2.6vmin + 8px,32px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0820;font-family:'Cairo','Tajawal','Geeza Pro','Segoe UI',Tahoma,sans-serif;color:var(--ink);direction:rtl;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:max(6px,env(safe-area-inset-top)) 10px 6px;z-index:5;pointer-events:none}
#hud .logo{height:clamp(46px,9vmin,72px);background:#fff;border-radius:14px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:auto}
#hud .stat{background:rgba(20,10,40,.62);backdrop-filter:blur(6px);color:#fff;border-radius:14px;padding:4px 12px;font-weight:800;font-size:clamp(16px,2.4vmin + 6px,24px);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid rgba(255,255,255,.2)}
#hud .grow{flex:1;min-width:60px}
#hud .prog{height:14px;background:rgba(0,0,0,.35);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#hud .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84d,#ff8a00);border-radius:10px;transition:width .5s}
#hud .stage{color:#fff;font-weight:800;font-size:clamp(13px,1.8vmin + 6px,18px);text-shadow:0 2px 4px rgba(0,0,0,.6);margin-bottom:3px;text-align:center}
#hud .ib{pointer-events:auto;width:clamp(40px,7vmin,52px);height:clamp(40px,7vmin,52px);border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,10,40,.6);color:#fff;font-size:clamp(18px,3vmin,24px);display:grid;place-items:center}
/* ---------- Question banner ---------- */
#qb{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(6px,env(safe-area-inset-top)) + clamp(58px,10vmin,84px));width:min(94vw,1100px);z-index:4;background:var(--card);border-radius:22px;padding:10px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid var(--a);text-align:center;transition:opacity .3s,transform .3s;pointer-events:none}
#qb.off{opacity:0;transform:translateX(-50%) translateY(-20px)}
#qb .tag{display:inline-block;background:var(--p);color:#fff;border-radius:20px;padding:0 14px;font-size:clamp(13px,1.6vmin + 6px,18px);font-weight:800;margin-bottom:2px}
#qb .qt{font-size:var(--fs-q);font-weight:800;line-height:1.55;word-spacing:3px}
#qb .hint{font-size:clamp(14px,1.6vmin + 7px,20px);color:#6a5b7b;font-weight:700}
#qb .built{margin-top:4px;font-size:var(--fs-o);font-weight:800;color:var(--ok);min-height:1em}
/* ---------- Touch controls ---------- */
#touch{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
#touch .grp{display:flex;gap:12px;pointer-events:auto;direction:ltr}
#touch button{width:clamp(66px,12vmin,92px);height:clamp(66px,12vmin,92px);border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(25,12,50,.45);color:#fff;font-size:clamp(26px,5vmin,40px);font-weight:900;backdrop-filter:blur(4px);touch-action:none}
#touch button.on{background:rgba(246,184,0,.75);transform:scale(.94)}
#touch button.wide{width:clamp(110px,20vmin,150px);border-radius:46px;font-size:clamp(18px,3vmin,26px)}
/* ---------- Footer ---------- */
#foot{position:absolute;bottom:0;left:0;right:0;z-index:6;text-align:center;font-size:clamp(11px,1.3vmin + 5px,14px);color:rgba(255,255,255,.92);background:linear-gradient(transparent,rgba(10,5,25,.7));padding:10px 6px calc(4px + env(safe-area-inset-bottom));pointer-events:none;font-weight:600;text-shadow:0 1px 3px #000}
/* ---------- Screens / overlays ---------- */
.screen{position:absolute;inset:0;z-index:10;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px 60px;touch-action:pan-y}
.overlay{position:absolute;inset:0;z-index:12;display:flex;justify-content:center;align-items:center;padding:14px;background:rgba(15,8,35,.45);backdrop-filter:blur(3px);touch-action:pan-y;overflow:auto}
.card{background:var(--card);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:22px clamp(16px,3vw,34px);width:min(96vw,960px);text-align:center;position:relative;margin:auto}
.btn{border:0;border-radius:40px;padding:12px 28px;font-weight:900;font-size:clamp(20px,2.4vmin + 10px,30px);color:#fff;background:linear-gradient(180deg,#8a33a8,var(--p));box-shadow:0 6px 0 #3e1050,0 10px 22px rgba(0,0,0,.3);margin:6px;min-width:180px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3e1050}
.btn.gold{background:linear-gradient(180deg,#ffd34d,#f29d00);color:#3a2300;box-shadow:0 6px 0 #a35f00,0 10px 22px rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(180deg,#34c77b,#16904f);box-shadow:0 6px 0 #0b5a30,0 10px 22px rgba(0,0,0,.3)}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 6px 0 #c9b7d3,0 8px 16px rgba(0,0,0,.15)}
.btn.sm{font-size:clamp(16px,1.6vmin + 8px,22px);padding:9px 18px;min-width:0}
/* start */
#start .card{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:4px solid rgba(255,255,255,.9)}
#start .biglogo{width:clamp(120px,22vmin,190px);border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.2);background:#fff;margin-top:-6px}
#start .row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
#start .cover{width:min(100%,430px);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.35);border:6px solid #fff;transform:rotate(-2deg);transition:transform .4s}
#start .cover:hover{transform:rotate(0) scale(1.02)}
#start .info{flex:1;min-width:260px}
#start h1{font-size:clamp(34px,5vmin + 14px,64px);margin:4px 0;line-height:1.25;background:linear-gradient(90deg,var(--p),#c2185b,#f29d00);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
#start .lesson{font-size:clamp(20px,2vmin + 12px,30px);font-weight:800;color:#5a4a6a;margin:0 0 6px}
#start .author{background:linear-gradient(90deg,#fff7e0,#fde9ff);border-radius:18px;padding:8px 12px;margin:8px 0;border:2px dashed #e5c0f0}

 {s:1,type:'mcq',q:'الخطوة الأولى لوزن الفعل المزيد:',o:['نُرجع الفعل إلى أصله بتجريده من أحرف الزيادة','نحذف الحرف الأخير','نضيف حرفًا','نحوّل الفعل إلى أمر'],a:0,ex:'نرجع الفعل إلى أصله بتجريده من أحرف الزيادة.'},
 {s:1,type:'mcq',q:'بعد تجريد الفعل، نقابل الحرف الأول من أصله بـ:',o:['الفاء','العين','اللام','الميم'],a:0,ex:'نقابل الحرف الأول من أصل الكلمة بالفاء، والثاني بالعين، والثالث باللام.'},
 {s:1,type:'mcq',q:'الأحرف الزائدة عند الوزن:',o:['نُبقيها مع المحافظة على الحركات والسكون كما هي','نحذفها','نستبدلها بالفاء','نضعها في آخر الوزن'],a:0,ex:'نبقي الأحرف الزائدة مع المحافظة على الحركات والسكون كما هي في الفعل الموزون.'},

 {s:2,type:'mcq',q:'وزن «اطْمَأَنَّ»:',o:['افْعَلَلَّ','افْتَعَلَ','اسْتَفْعَلَ','فَعْلَلَ'],a:0,ex:'اطمأنّ ← طمأن ← افعللّ.'},

 {s:4,type:'mcq',q:'الميزان الصرفي لكلٍّ من الفعلين (يَتَرَدَّدُ، أَقْبَلَ) على الترتيب:',o:['يَتَفَعَّلُ، أَفْعَلَ','يَنْفَعِلُ، أَفْعَلَ','يَفْتَعِلُ، فَعْلَلَ','يَتَفاعَلُ، فَعْلَلَ'],a:0,ex:'يتردّد ← ردد ← يتفعّل، وأقبل ← قبل ← أفعل.'},
 {s:4,type:'sort',q:'صنّف الأفعال: مجرد أم مزيد؟',bins:['مجرد','مزيد'],o:[{t:'وَهَبَ',b:0},{t:'زَلْزَلَ',b:0},{t:'طَمْأَنَ',b:0},{t:'تَماسَكَ',b:1},{t:'أَنْفَقَ',b:1},{t:'اكْتَسَبَ',b:1},{t:'اسْتَعْمَرَ',b:1}],ex:'المجرد كل حروفه أصلية، والمزيد زيد فيه حرف أو أكثر من حروف «سألتمونيها».'}
];
</script>
<script>/* Himam Game Core — محرك مشترك لألعاب أكاديمية همم التعليمية
   إعداد الأستاذ راشد الهادي — جميع الحقوق محفوظة لدى أكاديمية همم التعليمية */
(function(){
'use strict';
const H = window.Himam = {};
const $ = (s,el)=> (el||document).querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.random()*a.length|0];
H.u={rand,clamp,lerp,shuffle,pick};

/* ======================= AUDIO (WebAudio — أصوات وموسيقى أصلية مولّدة برمجيًا) ======================= */
const A = H.audio = {on:true,music:true,ctx:null};
A.init=function(){
  if(A.ctx){ if(A.ctx.state!=='running') A.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=A.ctx=new AC();
  A.master=c.createGain(); A.master.connect(c.destination);
  A.comp=c.createDynamicsCompressor(); A.comp.connect(A.master);
  A.mg=c.createGain(); A.mg.gain.value=0; A.mg.connect(A.comp);
  A.sg=c.createGain(); A.sg.gain.value=.5; A.sg.connect(A.comp);
  const len=c.sampleRate*.5, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1; A.nb=b;
  A.apply(); A.startMusic();
  document.addEventListener('visibilitychange',()=>{ if(!A.ctx) return; document.hidden?A.ctx.suspend():A.ctx.resume(); });
};
A.apply=function(){ if(!A.ctx) return; const t=A.ctx.currentTime;
  A.master.gain.setTargetAtTime(A.on?.9:0,t,.05); A.mg.gain.setTargetAtTime(A.music?.13:0,t,.25); };
A.tone=function(f,dur,type,vol,when,slide,dest){ if(!A.ctx) return; const c=A.ctx,t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.3,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);

  let seed=cfg.seed*9301+49297; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const sc=SCALES[cfg.scale]||SCALES.ajam, deg=d=>cfg.root+12*Math.floor(d/sc.length)+sc[((d%sc.length)+sc.length)%sc.length];
  const mkBar=()=>{const bar=[];let d=Math.floor(rnd()*5)+2;for(let i=0;i<8;i++){ if(rnd()<.22&&i%2){bar.push(null);continue;} d+=Math.round((rnd()-.5)*3.2); d=clamp(d,0,9); bar.push(d);} return bar;};
  const Abar=mkBar(),Bbar=mkBar(),Cbar=mkBar(),Dbar=mkBar(); const end=[4,null,2,null,0,null,null,null];
  const song=[Abar,Bbar,Abar,Cbar,Dbar,Bbar,Abar,end];

function syncSnd(){ $('#bSound').textContent=A.on?'🔊':'🔇'; $('#bMusic').style.opacity=A.music?1:.4; $('#bSnd2').textContent=A.on?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف'; }
const show=s=>$(s).classList.remove('hidden'), hide=s=>$(s).classList.add('hidden');

function bindInput(){
  addEventListener('keydown',e=>{ const k=KM[e.code]; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault();
    if((e.code==='Enter'||e.code==='Space')&&S.mode==='feedback'){ contFeedback(); return; }
    if((e.code==='Enter'||e.code==='Space')&&S.mode==='stage'){ S.scNext&&S.scNext(); return; }
    if(e.code==='Escape'||e.code==='KeyP'){ if(S.mode==='play') $('#bPause').click(); else if(S.mode==='paused') $('#bRes').click(); }
    if(k){ if(!I[k]) I._e[k]=1; I[k]=1; } });
  addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) I[k]=0; });
  addEventListener('blur',()=>I.clear());
  const toV=e=>({x:e.clientX/V.s,y:e.clientY/V.s});
  const cvEl=$('#cv');
  cvEl.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') markTouch(); const p=toV(e); Object.assign(I.ptr,{down:true,x:p.x,y:p.y,sx:p.x,sy:p.y,t:performance.now()}); I._e.ptr=1; });
  addEventListener('pointermove',e=>{ if(!I.ptr.down) return; const p=toV(e); I.ptr.x=p.x; I.ptr.y=p.y; });
  addEventListener('pointerup',e=>{ if(!I.ptr.down) return; I.ptr.down=false; const p=toV(e), dx=p.x-I.ptr.sx, dy=p.y-I.ptr.sy, dtm=performance.now()-I.ptr.t;
    if(Math.hypot(dx,dy)>45/V.s*V.s*0+40 && dtm<600){ I.swipes.push(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); }
    else if(dtm<400) I.taps.push(p); });
  addEventListener('touchstart',markTouch,{passive:true,once:true});
}
function markTouch(){ if(I.touch) return; I.touch=true; buildTouch(); resize(); }
function buildTouch(){ const t=H.cfg.touch||{}; const mk=(id,list)=>{ const g=$(id); g.innerHTML='';
  (list||[]).forEach(b=>{ const bt=el('button',{'aria-label':b.k,class:b.wide?'wide':''},b.g); const on=e=>{e.preventDefault(); if(!I[b.k]) I._e[b.k]=1; I[b.k]=1; bt.classList.add('on'); A.init();};
    const off=e=>{ I[b.k]=0; bt.classList.remove('on'); }; bt.addEventListener('pointerdown',on); bt.addEventListener('pointerup',off); bt.addEventListener('pointerleave',off); bt.addEventListener('pointercancel',off); g.appendChild(bt); }); };
  mk('#tL',t.left); mk('#tR',t.right); if(S&&S.mode==='play') show('#touch'); }

/* ---------- Questions ---------- */
function prep(q){ q=Object.assign({},q);
  if(q.type==='mcq'){ let o=q.o.map((t,i)=>({t,ok:i===q.a})); if(q.fixLast){const l=o.pop(); o=shuffle(o); o.push(l);} else o=shuffle(o); q.opts=o; }
  else if(q.type==='tf'){ q.opts=[{t:'صح ✔',ok:q.a===true},{t:'خطأ ✘',ok:q.a===false}]; }
  else if(q.type==='collect'){ q.opts=shuffle(q.o.map(x=>Object.assign({},x))); }
  return q; }
function buildQueue(from){ const bank=H.cfg.bank; S.queues=[0,1,2,3].map(s=>shuffle(bank.filter(q=>q.s===s+1)).map(prep));
  S.total=S.queues.slice(from).reduce((n,a)=>n+a.length,0); }
function startGame(stage){
  A.init(); syncSnd(); hide('#start'); hide('#res'); show('#hud'); if(I.touch) show('#touch'); if(H.cfg.landscape) show('#rot');
  Object.assign(S,{mode:'play',score:0,stars:0,ok:0,bad:0,streak:0,best:0,items:0,badges:[],log:[],cur:null,stage,answered:0});
  buildQueue(stage); api.demo=false; I.clear(); FX.l.length=0;
  H.cfg.game.reset&&H.cfg.game.reset(stage); hud(); toast('🏁 المرحلة '+(stage+1)+': '+STAGES[stage]); A.sfx.stage();
}
function hud(){ $('#hStars').textContent=S.stars; $('#hScore').textContent=S.score; $('#hStage').textContent='المرحلة '+(S.stage+1)+': '+STAGES[S.stage]+'  •  '+S.answered+'/'+S.total;
  $('#hProg').style.width=(S.total?S.answered/S.total*100:0)+'%'; }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); }
H.toast=toast;
function banner(q,hint){ $('#qTag').textContent=({mcq:'اختر الإجابة الصحيحة',tf:'صح أم خطأ؟',order:'رتّب بالترتيب الصحيح',collect:'اجمع العناصر الصحيحة'})[q.type]||'سؤال';
  $('#qText').textContent=q.q; $('#qHint').textContent=hint||''; $('#qBuilt').textContent=''; $('#qb').classList.remove('off'); setTimeout(resize,30); }
api.hideBanner=()=>{ $('#qb').classList.add('off'); setTimeout(resize,350); };
api.setBuilt=t=>{ $('#qBuilt').textContent=t; };
api.setHint=t=>{ $('#qHint').textContent=t; };
api.state=()=>S.mode;
api.canAsk=()=>S.mode==='play'&&!S.cur;
api.stageIdx=()=>S.stage;

/* يطلب السؤال التالي. يُرجع null إذا انتهت المرحلة أو إذا كان السؤال يُعرض في «بوابة المعرفة» */
api.next=function(hint){
  if(S.mode!=='play'||S.cur) return null;
  const qu=S.queues[S.stage];
  if(!qu.length){ stageEnd(); return null; }
  const q=qu.shift(); S.cur=q;
  const sup=H.cfg.game.supports||['mcq','tf'];
  if(!sup.includes(q.type)){ runChallenge(q); return null; }
  banner(q,hint||H.cfg.game.hint&&H.cfg.game.hint(q)); return q;
};
api.addPoints=function(n,x,y,txt){ S.score+=n; S.items++; if(x!=null) FX.text(x,y,txt||('+'+n)); if(S.items===20) badge('💎 جامع الكنوز'); hud(); };
api.partial=function(ok,x,y,txt){ if(ok){ A.sfx.coin(); FX.burst(x,y,14,{max:260}); FX.text(x,y-30,txt||'✔','#7cf29a'); S.score+=20; }
  else { A.sfx.wrong(); FX.text(x,y-30,txt||'✘ ليست صحيحة','#ffb4a8'); } hud(); };
function badge(b){ if(S.badges.includes(b)) return; S.badges.push(b); setTimeout(()=>toast('شارة جديدة: '+b),900); }

/* يسجّل الإجابة ويعرض التغذية الراجعة */
api.answer=function(ok,x,y,chosen,cb){
  const q=S.cur; if(!q) return; S.mode='feedback'; S.answered++;
  const right=correctText(q);
  S.log.push({q:q.q,ok,chosen,right,ex:q.ex});
  let gain=0;
  if(ok){ S.ok++; S.stars++; S.streak++; S.best=Math.max(S.best,S.streak); gain=100+(S.streak>=3?20*Math.min(S.streak-2,5):0); S.score+=gain;
    A.sfx.correct(); if(x!=null){ FX.burst(x,y,60); FX.text(x,y-40,'+'+gain); }
    if(S.ok===1) badge('🌟 الانطلاقة الأولى'); if(S.streak===3) badge('🔥 سلسلة ثلاثية'); if(S.streak===5) badge('🚀 خمس متتالية'); if(S.streak===8) badge('👑 بطل لا يتوقف'); }
  else { S.bad++; S.streak=0; A.sfx.wrong(); }
  hud(); S.afterFb=cb;
  setTimeout(()=>{
    const fb=$('#fb'); fb.classList.toggle('bad',!ok);
    $('#fEmo').textContent=ok?pick(['🌟','🎉','🏆','👏','🚀']):pick(['🤔','💪','🌱','🙂']);
    $('#fTitle').textContent=ok?pick(GOOD):pick(SOFT);
    $('#fPts').textContent=ok?('+'+gain+' نقطة  ⭐'):'';
    const choice=q.type==='mcq'||q.type==='tf'; $('#fAns').innerHTML=choice?((ok?'✅ ':'💡 الإجابة الصحيحة: ')+escapeH(right)):(ok?'✅ أكملت التحدي دون أخطاء!':'💡 أكملت التحدي ('+escapeH(chosen||'')+') — تأمّل الحل الصحيح:');
    $('#fEx').textContent=q.ex||''; show('#fb'); S.fbShown=true; if(ok) for(let i=0;i<3;i++) setTimeout(()=>FX.firework(rand(V.W*.2,V.W*.8),rand(V.H*.2,V.H*.45)),i*250);
  }, ok?650:450);
};
function correctText(q){ if(q.opts&&(q.type==='mcq'||q.type==='tf')) return q.opts.find(o=>o.ok).t;
  if(q.type==='order') return q.o.join(' ');
  if(q.type==='collect') return q.o.filter(x=>x.ok).map(x=>x.t).join('، ');
  if(q.type==='sort') return q.bins.map((b,i)=>b+': '+q.o.filter(x=>x.b===i).map(x=>x.t).join('، ')).join(' | ');
  if(q.type==='match') return q.o.map(p=>p[0]+' ← '+p[1]).join(' | ');
  return ''; }
function escapeH(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
function contFeedback(){ if(S.mode!=='feedback'||!S.fbShown) return; S.fbShown=false; hide('#fb'); api.hideBanner(); const q=S.cur; S.cur=null; S.mode='play'; I.clear(); A.sfx.click();
  const cb=S.afterFb; S.afterFb=null; cb&&cb(); const st=S.stage; if(!S.queues[st].length) setTimeout(()=>{ if(S.mode==='play'&&!S.cur&&S.stage===st&&!S.queues[st].length) stageEnd(); },700); }

function stageEnd(){
  if(S.mode!=='play') return; S.mode='stage'; S.cur=null; api.hideBanner();
  const last=S.stage>=3; badge('🏅 '+STAGES[S.stage]);
  A.sfx.stage(); for(let i=0;i<5;i++) setTimeout(()=>FX.firework(rand(V.W*.15,V.W*.85),rand(V.H*.15,V.H*.5)),i*220);
  $('#scMedal').textContent=['🥉','🥈','🥇','🏆'][S.stage];
  $('#scTitle').textContent='أنهيت المرحلة '+(S.stage+1)+': '+STAGES[S.stage]+'!';
  $('#scSub').textContent=last?'أتممت المغامرة كاملة! لنرَ نتيجتك 🎉':('استعدّ للمرحلة '+(S.stage+2)+': '+STAGES[S.stage+1]+' ⚡');
  $('#bSc').textContent=last?'عرض النتيجة 🏆':'إلى المرحلة التالية ▶';
  show('#sc');
  S.scNext=()=>{ S.scNext=null; hide('#sc'); if(last){ results(); return; } S.stage++; S.mode='play'; I.clear(); hud(); H.cfg.game.onStage&&H.cfg.game.onStage(S.stage); toast('🏁 المرحلة '+(S.stage+1)+': '+STAGES[S.stage]); };
}

/* ======================= «بوابة المعرفة»: السحب والإفلات / التوصيل / الترتيب / الجمع ======================= */
function runChallenge(q){
  S.mode='challenge'; A.sfx.whoosh();
  const card=$('#chCard'); let mistakes=0;
  const head=`<h2>🔑 بوابة المعرفة</h2><div class="qt">${escapeH(q.q)}</div><div class="mist" id="chM"></div>`;
  const done=()=>{ setTimeout(()=>{ hide('#ch'); S.mode='play'; api.answer(mistakes===0,V.W/2,V.H/2,mistakes?('عدد الأخطاء: '+mistakes):'',()=>{}); },700); };
  const miss=(e,msg)=>{ mistakes++; A.sfx.wrong(); if(e){ e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); } $('#chM').textContent=msg||'حاول مرة أخرى 💪'; };
  const good=e=>{ A.sfx.coin(); S.score+=20; hud(); $('#chM').textContent=''; };
  if(q.type==='sort'){
    card.innerHTML=head+`<div class="pool" id="pool"></div><div class="bins">${q.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${escapeH(b)}</h3><div class="in"></div></div>`).join('')}</div>`;
    const pool=$('#pool'); let sel=null, left=q.o.length;
    shuffle(q.o).forEach(it=>{ const c=el('div',{class:'chip'},escapeH(it.t)); c._b=it.b; pool.appendChild(c); enableDrag(c); });
    const place=(chip,bin)=>{ if(+bin.dataset.b===chip._b){ chip.classList.remove('sel'); chip.classList.add('ok'); bin.querySelector('.in').appendChild(chip); chip._done=true; good(); left--; if(!left) done(); }
      else miss(chip,'هذه البطاقة لا تنتمي إلى «'+bin.querySelector('h3').textContent+'» — جرّب مكانًا آخر'); sel=null; };
    card.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{ if(sel) place(sel,b); });
    function enableDrag(c){ let ghost=null,ox=0,oy=0,moved=false,sx=0,sy=0;
      c.addEventListener('pointerdown',e=>{ if(c._done) return; e.preventDefault(); A.init(); sx=e.clientX; sy=e.clientY; moved=false; c.setPointerCapture(e.pointerId); const r=c.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; });
      c.addEventListener('pointermove',e=>{ if(c._done||!c.hasPointerCapture(e.pointerId)) return; if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8) return;
        if(!moved){ moved=true; ghost=c.cloneNode(true); ghost.classList.add('drag'); document.body.appendChild(ghost); c.classList.add('dim'); }
        ghost.style.left=(e.clientX-ox)+'px'; ghost.style.top=(e.clientY-oy)+'px';
        card.querySelectorAll('.bin').forEach(b=>{ const r=b.getBoundingClientRect(); b.classList.toggle('hot',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom); }); });
      c.addEventListener('pointerup',e=>{ if(c._done) return; card.querySelectorAll('.bin').forEach(b=>b.classList.remove('hot'));
        if(moved){ ghost&&ghost.remove(); ghost=null; c.classList.remove('dim'); const t=[...card.querySelectorAll('.bin')].find(b=>{const r=b.getBoundingClientRect(); return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;}); if(t) place(c,t); }
        else { if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); A.sfx.click(); } });
      c.addEventListener('pointercancel',()=>{ ghost&&ghost.remove(); ghost=null; c.classList.remove('dim'); }); }
  } else if(q.type==='match'){
    const L=shuffle(q.o.map((p,i)=>({t:p[0],i}))), R=shuffle(q.o.map((p,i)=>({t:p[1],i})));
    card.innerHTML=head+`<div class="hint" style="font-weight:800;color:#0b6aa2;font-size:20px">المس عنصرًا من اليمين ثم ما يناسبه من اليسار</div><div class="match"><div class="col" id="mL"></div><div class="col" id="mR"></div></div>`;
    let sel=null, left=q.o.length;
    L.forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c._i=x.i; c.onclick=()=>{ if(c._done) return; if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); A.sfx.click(); }; $('#mL').appendChild(c); });
    R.forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c._i=x.i; c.onclick=()=>{ if(c._done||!sel) return;
      if(sel._i===c._i){ sel.classList.remove('sel'); sel.classList.add('ok'); c.classList.add('ok'); sel._done=c._done=true; sel=null; good(); left--; if(!left) done(); } else miss(c,'ليس هذا ما يناسبه، جرّب غيره'); }; $('#mR').appendChild(c); });
  } else if(q.type==='order'){
    card.innerHTML=head+`<div class="slots" id="sl"></div><div class="pool" id="pool"></div>`;
    let k=0; shuffle(q.o.map((t,i)=>({t,i}))).forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c.onclick=()=>{ if(c._done) return;
      if(x.i===k){ c._done=true; c.classList.add('ok'); $('#sl').appendChild(c); k++; good(); if(k===q.o.length) done(); } else miss(c,'ليست هذه الكلمة التالية'); }; $('#pool').appendChild(c); });
  } else if(q.type==='collect'){
    const need=q.o.filter(x=>x.ok).length; let got=0;
    card.innerHTML=head+`<div class="pool" id="pool"></div>`;
    shuffle(q.o).forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c.onclick=()=>{ if(c._done) return; c._done=true;
      if(x.ok){ c.classList.add('ok'); good(); got++; if(got===need) done(); } else { c.classList.add('dim'); miss(c,'«'+x.t+'» ليست من المطلوب'); } }; $('#pool').appendChild(c); });
  } else { // احتياط
    card.innerHTML=head; done();
  }
  show('#ch');
}
api.overlay=runChallenge;

/* ======================= النتيجة النهائية وشهادة الإنجاز الفاخرة ======================= */
const LEVELS=[

function arNum(n){ return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]); }
let gender='m';
function results(){

function certName(){ return (H.playerName||'').trim(); }
function fileName(){ const n=certName().replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_')||'بطل_همم'; return 'شهادة_إنجاز_'+n+'.png'; }
function renderCert(){ return drawCert().then(c=>{ S.certCanvas=c; $('#certImg').src=c.toDataURL('image/jpeg',.8); }); }
function certBlob(){ return new Promise(res=>S.certCanvas.toBlob(b=>res(b),'image/png')); }
async function saveCert(){
  A.sfx.click(); await renderCert(); const b=await certBlob(); const url=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=url; a.download=fileName(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $('#saveNote').textContent='✅ أُنشئت الشهادة باسم الملف: '+fileName()+' — إن لم تظهر في التنزيلات، اضغط «عرض الشهادة لحفظها يدويًّا».';
}
async function shareCert(){
  A.sfx.click(); await renderCert(); const b=await certBlob();
  const f=new File([b],fileName(),{type:'image/png'});
  const txt=`🎓 حصلتُ على شهادة إنجاز في مغامرة «${H.cfg.title}» — درس ${H.cfg.lesson}\nمن أكاديمية همم التعليمية مع الأستاذ راشد الهادي 🌟`;
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],text:txt}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  $('#saveNote').textContent='جهازك لا يدعم مشاركة الصور مباشرة من المتصفح: احفظ الشهادة أولًا ثم شاركها من معرض الصور.'; viewCert();
}
function viewCert(){
  const ov=document.createElement('div'); ov.className='overlay'; ov.style.zIndex=50;
  ov.innerHTML=`<div class="card" style="max-width:1100px"><p class="note" style="font-size:20px">📱 على الآيفون والآيباد: اضغط مطوّلًا على الشهادة ثم اختر «حفظ في الصور».<br>💻 على الحاسوب: انقر بالزر الأيمن ثم «حفظ الصورة».</p><img style="width:100%;border-radius:12px" src="${S.certCanvas.toDataURL('image/png')}" alt="شهادة الإنجاز"><button class="btn" style="margin-top:10px">إغلاق</button></div>`;
  ov.querySelector('button').onclick=()=>ov.remove(); document.body.appendChild(ov);
}
let logoImg=null;
function loadLogo(){ return new Promise(r=>{ if(logoImg&&logoImg.complete) return r(); logoImg=new Image(); logoImg.onload=r; logoImg.onerror=r; logoImg.src=H.cfg.logo; }); }
async function drawCert(){
  try{ await Promise.all([document.fonts.load('900 80px Cairo'),document.fonts.load('700 80px Amiri'),document.fonts.load('700 40px Cairo')]); }catch(e){}
  await loadLogo();
  const W=2480,Hh=1754, c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d');
  const NAVY='#1b2a4e', GOLD='#b8902f', GOLD2='#e6c66a', INK='#2c2a35', F=H.cfg, f=S.final, L=f.L, fem=gender==='f';
  // الخلفية العاجية
  const g=x.createRadialGradient(W/2,Hh/2,200,W/2,Hh/2,W*.75); g.addColorStop(0,'#fffdf7'); g.addColorStop(1,'#f3e9d2'); x.fillStyle=g; x.fillRect(0,0,W,Hh);
  // نقش هندسي خفيف في الخلفية
  x.save(); x.globalAlpha=.05; x.strokeStyle=NAVY; x.lineWidth=2; for(let yy=120;yy<Hh;yy+=120) for(let xx=120;xx<W;xx+=120){ star8(x,xx,yy,34,'stroke'); } x.restore();
  // الإطار
  x.fillStyle=NAVY; x.fillRect(0,0,W,46); x.fillRect(0,Hh-46,W,46); x.fillRect(0,0,46,Hh); x.fillRect(W-46,0,46,Hh);
  x.strokeStyle=GOLD; x.lineWidth=10; x.strokeRect(70,70,W-140,Hh-140); x.lineWidth=3; x.strokeRect(92,92,W-184,Hh-184);
  // شريط زخرفي معيّنات
  x.fillStyle=GOLD; for(let xx=130;xx<W-130;xx+=44){ dia(x,xx,81,9); dia(x,xx,Hh-81,9); } for(let yy=130;yy<Hh-130;yy+=44){ dia(x,81,yy,9); dia(x,W-81,yy,9); }
  // زوايا: نجمة ثمانية عُمانية
  for(const [cx,cy] of [[150,150],[W-150,150],[150,Hh-150],[W-150,Hh-150]]){ x.fillStyle=NAVY; star8(x,cx,cy,58,'fill'); x.fillStyle=GOLD2; star8(x,cx,cy,40,'fill'); x.fillStyle=NAVY; x.beginPath(); x.arc(cx,cy,13,0,7); x.fill(); }
  x.direction='rtl'; x.textAlign='center'; x.textBaseline='alphabetic';
  const T=(t,y,font,col,xx)=>{ x.font=font; x.fillStyle=col; x.fillText(t,xx==null?W/2:xx,y); };
  // الشعار
  x.save(); x.shadowColor='rgba(0,0,0,.15)'; x.shadowBlur=20; x.fillStyle='#fff'; H.rr(x,W/2-125,130,250,250,40); x.fill(); x.restore();
  if(logoImg&&logoImg.naturalWidth) x.drawImage(logoImg,W/2-115,140,230,230);
  T('أكاديمية همم التعليمية',455,'800 58px Cairo',NAVY);
  // العنوان
  x.save(); const tg=x.createLinearGradient(0,470,0,600); tg.addColorStop(0,'#d7b250'); tg.addColorStop(1,'#9c7420'); T('شهادة إنجاز وتقدير',590,'700 132px Amiri, Cairo',tg); x.restore();
  flourish(x,W/2,635,520,GOLD);
  T(`تتقدّم أكاديمية همم التعليمية بخالص التهنئة والتقدير إلى ${fem?'الطالبة':'الطالب'}:`,725,'600 50px Cairo',INK);
  // الاسم
  const nm=certName()||(fem?'بطلة همم':'بطل همم'); let ns=150; x.font=`700 ${ns}px Amiri, Cairo`; while(x.measureText(nm).width>1500&&ns>70){ ns-=6; x.font=`700 ${ns}px Amiri, Cairo`; }
  T(nm,890,`700 ${ns}px Amiri, Cairo`,NAVY);
  x.strokeStyle=GOLD; x.lineWidth=4; x.beginPath(); x.moveTo(W/2-620,925); x.lineTo(W/2+620,925); x.stroke(); dia(x,W/2,925,14);
  T(`وذلك تقديرًا ${fem?'لإتمامها':'لإتمامه'} المغامرة التعليمية التفاعلية في درس:`,1005,'600 48px Cairo',INK);
  T(F.lesson,1110,'700 92px Amiri, Cairo',GOLD);
  T(`مغامرة «${F.title}» — اللغة العربية، ${F.grade}`,1175,'600 38px Cairo','#5d5a6a');
  // صف البيانات
  const boxes=[['الدرجة',`${arNum(S.ok)} من ${arNum(f.tot)}`],['نسبة الإنجاز',`${arNum(f.pct)}٪`],['مستوى الإنجاز',L.name],['تاريخ الإتمام',f.date.toLocaleDateString('ar-OM',{year:'numeric',month:'long',day:'numeric'})]];
  const bw=440,gap=34,bx0=W/2+ (bw*4+gap*3)/2;
  boxes.forEach((b,i)=>{ const cx=bx0-bw/2-i*(bw+gap), y0=1220; x.fillStyle='rgba(255,255,255,.85)'; H.rr(x,cx-bw/2,y0,bw,150,22); x.fill(); x.strokeStyle=GOLD; x.lineWidth=3; x.stroke();
    T(b[0],y0+50,'700 32px Cairo','#7a6a4a',cx); let fs=i===2?44:54; x.font=`800 ${fs}px Cairo`; while(x.measureText(b[1]).width>bw-30&&fs>26){fs-=2;x.font=`800 ${fs}px Cairo`;} T(b[1],y0+118,`800 ${fs}px Cairo`,NAVY,cx); });
  T(L.txt,1440,'600 42px Cairo',L.key==='persist'?'#2f7d4f':'#7a5a10');
  // الوسام (شعار المستوى)
  medal(x,330,1010,L);
  // التوقيع النصي
  T('إعداد وتقديم: أ. راشد الهادي',1545,'700 44px Cairo',NAVY,W-560);
  T('أكاديمية همم التعليمية',1600,'600 38px Cairo','#5d5a6a',W-560);
  T('راشد الهادي',1545,'700 64px Amiri, Cairo','#26345e',560); x.strokeStyle='#26345e'; x.lineWidth=2; x.beginPath(); x.moveTo(380,1565); x.lineTo(740,1565); x.stroke();
  T('التوقيع',1610,'600 30px Cairo','#7a7a8a',560);
  T('جميع الحقوق محفوظة لدى أكاديمية همم التعليمية',1655,'600 30px Cairo','#6a6478');
  return c;
}
function dia(x,cx,cy,r){ x.beginPath(); x.moveTo(cx,cy-r); x.lineTo(cx+r,cy); x.lineTo(cx,cy+r); x.lineTo(cx-r,cy); x.closePath(); x.fill(); }
function star8(x,cx,cy,r,mode){ x.beginPath(); for(let i=0;i<16;i++){ const a=i*Math.PI/8, rr=i%2?r*.72:r; x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);} x.closePath(); mode==='stroke'?x.stroke():x.fill(); }
function flourish(x,cx,cy,w,col){ x.strokeStyle=col; x.lineWidth=4; x.beginPath(); x.moveTo(cx-w/2,cy); x.quadraticCurveTo(cx-w/4,cy-26,cx-40,cy); x.moveTo(cx+w/2,cy); x.quadraticCurveTo(cx+w/4,cy-26,cx+40,cy); x.stroke(); x.fillStyle=col; star8(x,cx,cy,22,'fill'); }
function medal(x,cx,cy,L){
  x.fillStyle='#1b2a4e'; x.beginPath(); x.moveTo(cx-70,cy-40); x.lineTo(cx-120,cy+200); x.lineTo(cx-60,cy+170); x.lineTo(cx-30,cy+230); x.lineTo(cx+10,cy+20); x.fill();
  x.fillStyle='#8a1c3b'; x.beginPath(); x.moveTo(cx+70,cy-40); x.lineTo(cx+120,cy+200); x.lineTo(cx+60,cy+170); x.lineTo(cx+30,cy+230); x.lineTo(cx-10,cy+20); x.fill();
  const g=x.createRadialGradient(cx-40,cy-140,10,cx,cy-90,150); g.addColorStop(0,L.c1); g.addColorStop(1,L.c2);
  x.fillStyle=g; star8(x,cx,cy-90,150,'fill'); x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(cx,cy-90,105,0,7); x.fill();
  x.strokeStyle=L.c2; x.lineWidth=6; x.beginPath(); x.arc(cx,cy-90,105,0,7); x.stroke();
  x.textAlign='center'; x.direction='rtl'; x.fillStyle='#1b2a4e'; x.font='800 44px Cairo'; const w=L.name.split(' '); x.fillText(w[0],cx,cy-105); let ms=34; const w2=w.slice(1).join(' '); x.font=`700 ${ms}px Cairo`; while(x.measureText(w2).width>190&&ms>20){ ms-=2; x.font=`700 ${ms}px Cairo`; } x.fillText(w2,cx,cy-55);
}

})();

let api,V,stage=0,B={x:0,vx:0,cheer:0},hook={d:0,st:'idle',fish:null},fish=[],junk=[],q=null,wait=1,shells=[];
G.dbg=()=>({B,hook,fish,q});
G.init=a=>{api=a;V=H.view;};
G.reset=s=>{stage=s||0;q=null;wait=1;fish=[];junk=[];B.x=V.W/2;hook={d:0,st:'idle',fish:null};};
G.onStage=s=>{stage=s;};
G.hint=()=>'🎣 حرّك القارب ⬅ ➡ ثم أنزل الصنارة ⬇ فوق سمكة الإجابة الصحيحة';
const waterY=()=>Math.max(V.top,90)+90, bedY=()=>V.H-V.bot-20;
function rows(n){ const a=waterY()+80,b=bedY()-40; return Array.from({length:n},(_,i)=>a+(b-a)*(i+.5)/n); }
G.update=(dt,I)=>{
  G.t+=dt; V=H.view;
  const ys=rows(Math.max(fish.length,1)); fish.forEach((f,i)=>{ f.y=lerp(f.y,ys[i],dt*3); if(f.caught) return; f.x+=f.vx*dt; if(f.x<70||f.x>V.W-70) f.vx*=-1; f.x=clamp(f.x,70,V.W-70); });
  if(api.demo){ B.x=V.W/2+Math.sin(G.t*.6)*V.W*.3; return; }
  if(!q&&api.canAsk()){ wait-=dt; if(wait<=0){ const nq=api.next(); if(nq){ q=nq; const sp=40+stage*25; fish=q.opts.map((o,i)=>({t:o.t,ok:o.ok,x:rand(120,V.W-120),y:V.H+80,vx:(i%2?1:-1)*sp*rand(.7,1.2),c:FC[i%5]})); } } }
  let ax=(I.right?1:0)-(I.left?1:0); let drop=I.down||I.jump;
  if(I.ptr.down&&I.ptr.y>V.top){ ax=clamp((I.ptr.x-B.x)/50,-1,1); if(Math.abs(I.ptr.x-B.x)<40) drop=true; }
  if(hook.st==='idle'){ B.vx=lerp(B.vx,ax*320,dt*6); B.x=clamp(B.x+B.vx*dt,60,V.W-60); if(drop&&q&&!q.done){ hook.st='down'; H.audio.sfx.splash(); } }
  else B.vx=lerp(B.vx,0,dt*8);
  const maxD=bedY()-waterY();
  if(hook.st==='down'){ hook.d+=420*dt; const hy=waterY()+hook.d;
    for(const f of fish){ if(!f.caught&&Math.abs(f.x-B.x)<58&&Math.abs(f.y-hy)<34){ f.caught=1; hook.fish=f; hook.st='up'; H.audio.sfx.pop(); break; } }
    for(const j of junk){ if(!j.hit&&Math.abs(j.x-B.x)<40&&Math.abs(j.y-hy)<30){ j.hit=1; hook.st='up'; H.toast('علقت الصنارة بشبكة قديمة! 🕸️'); H.audio.sfx.bump(); } }
    if(hook.d>=maxD) hook.st='up'; }
  if(hook.st==='up'){ hook.d-=520*dt; if(hook.fish){ hook.fish.x=B.x; hook.fish.y=waterY()+hook.d; }
    if(hook.d<=0){ hook.d=0; hook.st='idle'; const f=hook.fish; hook.fish=null;
      if(f&&q&&!q.done){ q.done=true; B.cheer=f.ok?2:0; api.answer(f.ok,B.x,waterY()-60,f.t,()=>{ q=null; fish=[]; wait=.6; }); } } }
  B.cheer-=dt;
  if(stage>0&&junk.length<stage&&Math.random()<dt*.3) junk.push({x:rand(60,V.W-60),y:rand(waterY()+60,bedY()-30),vx:rand(-30,30)});
  for(const j of junk){ j.x+=j.vx*dt; if(j.x<40||j.x>V.W-40) j.vx*=-1; } junk=junk.filter(j=>!j.hit);
};
G.render=(c)=>{
  V=H.view; const W=V.W,HH=V.H,t=G.t,wy=waterY();
  const sk=[['#9fdcff','#ffeccc'],['#86ccff','#ffe4b5'],['#ffa774','#ffe0a8'],['#2a2560','#6b4f8f']][stage];
  const g=c.createLinearGradient(0,0,0,wy); g.addColorStop(0,sk[0]); g.addColorStop(1,sk[1]); c.fillStyle=g; c.fillRect(0,0,W,wy);
  // صور: قلعة وفنار على الأفق
  c.fillStyle='rgba(150,110,80,.6)'; c.fillRect(W*.08,wy-60,90,60); c.fillRect(W*.08+20,wy-90,30,30); c.fillStyle='rgba(240,240,240,.85)'; c.fillRect(W*.85,wy-110,18,110); c.fillStyle='#e2412f'; c.fillRect(W*.85,wy-80,18,14);
  const sg=c.createLinearGradient(0,wy,0,HH); sg.addColorStop(0,'#2fb0d8'); sg.addColorStop(1,'#0b4f7a'); c.fillStyle=sg; c.fillRect(0,wy,W,HH-wy);
  c.fillStyle='rgba(255,255,255,.35)'; for(let x=0;x<W;x+=40){ c.beginPath(); c.arc(x+(t*30)%40,wy,16,0,Math.PI); c.fill(); }
  c.fillStyle='#e8d5a3'; c.fillRect(0,bedY(),W,HH-bedY()); for(let x=20;x<W;x+=120){ c.fillStyle='#ff8787'; c.beginPath(); c.ellipse(x,bedY()-8,8,18,0,0,7); c.fill(); c.strokeStyle='#2f9e44'; c.lineWidth=5; c.beginPath(); c.moveTo(x+40,bedY()); c.quadraticCurveTo(x+40+Math.sin(t+x)*10,bedY()-30,x+40,bedY()-60); c.stroke(); }
  for(const j of junk){ c.strokeStyle='rgba(60,60,60,.7)'; c.lineWidth=2; for(let k=-2;k<=2;k++){ c.beginPath(); c.moveTo(j.x-26,j.y+k*8); c.lineTo(j.x+26,j.y+k*8); c.stroke(); c.beginPath(); c.moveTo(j.x+k*10,j.y-18); c.lineTo(j.x+k*10,j.y+18); c.stroke(); } }
  for(const f of fish){ c.save(); c.translate(f.x,f.y); c.scale(f.vx>0?-1:1,1); if(f.caught) c.rotate(-1.2);
    c.fillStyle=f.c; c.beginPath(); c.ellipse(0,0,40,20,0,0,7); c.fill(); c.beginPath(); c.moveTo(34,0); c.lineTo(58,-16); c.lineTo(58,16); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(-20,-4,6,0,7); c.fill(); c.fillStyle='#000'; c.beginPath(); c.arc(-21,-4,3,0,7); c.fill(); c.restore();
    if(!f.caught||hook.st==='up') H.label(c,f.t,f.x,f.y-44,{size:W<700?21:24,maxW:Math.min(380,W*.46),bg:'rgba(255,255,255,.95)',border:f.c,borderW:5,radius:12}); }
  // القارب والصياد
  const bob=Math.sin(t*2)*3, bx=B.x;
  c.strokeStyle='#ddd'; c.lineWidth=2; c.beginPath(); c.moveTo(bx+40,wy-70+bob); c.lineTo(bx,wy+hook.d); c.stroke();
  c.fillStyle='#888'; c.beginPath(); c.arc(bx,wy+hook.d,6,0,Math.PI); c.stroke(); c.fillStyle='#e2412f'; c.beginPath(); c.arc(bx,wy+hook.d-10,6,0,7); c.fill();
  c.fillStyle='#8b5a2b'; c.beginPath(); c.moveTo(bx-80,wy-20+bob); c.lineTo(bx+90,wy-26+bob); c.lineTo(bx+60,wy+14+bob); c.lineTo(bx-60,wy+14+bob); c.closePath(); c.fill(); c.fillStyle='#6b2183'; c.fillRect(bx-70,wy-14+bob,150,6);
  H.drawBoy(c,bx-10,wy-20+bob,.8,{t,pose:B.cheer>0?'cheer':'stand',face:hook.st==='idle'?'happy':'focus',shadow:false});
  c.strokeStyle='#5a3a1a'; c.lineWidth=4; c.beginPath(); c.moveTo(bx+8,wy-60+bob); c.lineTo(bx+40,wy-72+bob); c.stroke();
  // مؤشر موضع الصنارة
  if(q&&!q.done&&hook.st==='idle'){ c.save(); c.setLineDash([8,10]); c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=3; c.beginPath(); c.moveTo(bx,wy+10); c.lineTo(bx,bedY()); c.stroke(); c.restore(); }
};
H.boot({id:'fishing',title:'صيّاد صُور الماهر',lesson:'',theme:{p:'#0b6a8f',a:'#ffd43b'},logo:ASSETS.logo,cover:ASSETS.cover,bank:[],landscape:false,
  music:{bpm:98,root:59,scale:'nahawand',seed:38,lead:'sine'},
  touch:{left:[{k:'left',g:'⬅'},{k:'right',g:'➡'}],right:[{k:'down',g:'🎣',wide:true}]},
  howto:['أبحر بقارب الصيد قرب ساحل صُور العريقة. 🎣','حرّك القارب يمينًا ويسارًا بالسهمين، أو المس الشاشة جهة المكان الذي تريده.','أنزل الصنارة بزر 🎣 أو السهم للأسفل أو المسافة، أو المس القارب نفسه.','تحت الماء أسماك تحمل الإجابات وتسبح ذهابًا وإيابًا؛ اصطد سمكة الإجابة الصحيحة، وتجنّب الشباك القديمة 🕸️.'],
  game:G});
})();
</script>
