<style>:root{--p:#6b2183;--a:#f6b800;--ok:#1aa865;--bad:#e2574c;--ink:#1d1630;--card:rgba(255,255,255,.94);--glass:rgba(255,255,255,.18);--fs-q:clamp(22px,3.4vmin + 8px,40px);--fs-o:clamp(20px,2.6vmin + 8px,32px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0820;font-family:'Cairo','Tajawal','Geeza Pro','Segoe UI',Tahoma,sans-serif;color:var(--ink);direction:rtl;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:max(6px,env(safe-area-inset-top)) 10px 6px;z-index:5;pointer-events:none}
#hud .logo{height:clamp(46px,9vmin,72px);background:#fff;border-radius:14px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:auto}
#hud .stat{background:rgba(20,10,40,.62);backdrop-filter:blur(6px);color:#fff;border-radius:14px;padding:4px 12px;font-weight:800;font-size:clamp(16px,2.4vmin + 6px,24px);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid rgba(255,255,255,.2)}
#hud .grow{flex:1;min-width:60px}
#hud .prog{height:14px;background:rgba(0,0,0,.35);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#hud .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84d,#ff8a00);border-radius:10px;transition:width .5s}
#hud .stage{color:#fff;font-weight:800;font-size:clamp(13px,1.8vmin + 6px,18px);text-shadow:0 2px 4px rgba(0,0,0,.6);margin-bottom:3px;text-align:center}
#hud .ib{pointer-events:auto;width:clamp(40px,7vmin,52px);height:clamp(40px,7vmin,52px);border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,10,40,.6);color:#fff;font-size:clamp(18px,3vmin,24px);display:grid;place-items:center}
/* ---------- Question banner ---------- */
#qb{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(6px,env(safe-area-inset-top)) + clamp(58px,10vmin,84px));width:min(94vw,1100px);z-index:4;background:var(--card);border-radius:22px;padding:10px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid var(--a);text-align:center;transition:opacity .3s,transform .3s;pointer-events:none}
#qb.off{opacity:0;transform:translateX(-50%) translateY(-20px)}
#qb .tag{display:inline-block;background:var(--p);color:#fff;border-radius:20px;padding:0 14px;font-size:clamp(13px,1.6vmin + 6px,18px);font-weight:800;margin-bottom:2px}
#qb .qt{font-size:var(--fs-q);font-weight:800;line-height:1.55;word-spacing:3px}
#qb .hint{font-size:clamp(14px,1.6vmin + 7px,20px);color:#6a5b7b;font-weight:700}
#qb .built{margin-top:4px;font-size:var(--fs-o);font-weight:800;color:var(--ok);min-height:1em}
/* ---------- Touch controls ---------- */
#touch{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
#touch .grp{display:flex;gap:12px;pointer-events:auto;direction:ltr}
#touch button{width:clamp(66px,12vmin,92px);height:clamp(66px,12vmin,92px);border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(25,12,50,.45);color:#fff;font-size:clamp(26px,5vmin,40px);font-weight:900;backdrop-filter:blur(4px);touch-action:none}
#touch button.on{background:rgba(246,184,0,.75);transform:scale(.94)}
#touch button.wide{width:clamp(110px,20vmin,150px);border-radius:46px;font-size:clamp(18px,3vmin,26px)}
/* ---------- Footer ---------- */
#foot{position:absolute;bottom:0;left:0;right:0;z-index:6;text-align:center;font-size:clamp(11px,1.3vmin + 5px,14px);color:rgba(255,255,255,.92);background:linear-gradient(transparent,rgba(10,5,25,.7));padding:10px 6px calc(4px + env(safe-area-inset-bottom));pointer-events:none;font-weight:600;text-shadow:0 1px 3px #000}
/* ---------- Screens / overlays ---------- */
.screen{position:absolute;inset:0;z-index:10;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px 60px;touch-action:pan-y}
.overlay{position:absolute;inset:0;z-index:12;display:flex;justify-content:center;align-items:center;padding:14px;background:rgba(15,8,35,.45);backdrop-filter:blur(3px);touch-action:pan-y;overflow:auto}
.card{background:var(--card);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:22px clamp(16px,3vw,34px);width:min(96vw,960px);text-align:center;position:relative;margin:auto}
.btn{border:0;border-radius:40px;padding:12px 28px;font-weight:900;font-size:clamp(20px,2.4vmin + 10px,30px);color:#fff;background:linear-gradient(180deg,#8a33a8,var(--p));box-shadow:0 6px 0 #3e1050,0 10px 22px rgba(0,0,0,.3);margin:6px;min-width:180px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3e1050}
.btn.gold{background:linear-gradient(180deg,#ffd34d,#f29d00);color:#3a2300;box-shadow:0 6px 0 #a35f00,0 10px 22px rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(180deg,#34c77b,#16904f);box-shadow:0 6px 0 #0b5a30,0 10px 22px rgba(0,0,0,.3)}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 6px 0 #c9b7d3,0 8px 16px rgba(0,0,0,.15)}
.btn.sm{font-size:clamp(16px,1.6vmin + 8px,22px);padding:9px 18px;min-width:0}
/* start */
#start .card{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:4px solid rgba(255,255,255,.9)}
#start .biglogo{width:clamp(120px,22vmin,190px);border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.2);background:#fff;margin-top:-6px}
#start .row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
#start .cover{width:min(100%,430px);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.35);border:6px solid #fff;transform:rotate(-2deg);transition:transform .4s}
#start .cover:hover{transform:rotate(0) scale(1.02)}
#start .info{flex:1;min-width:260px}
#start h1{font-size:clamp(34px,5vmin + 14px,64px);margin:4px 0;line-height:1.25;background:linear-gradient(90deg,var(--p),#c2185b,#f29d00);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
#start .lesson{font-size:clamp(20px,2vmin + 12px,30px);font-weight:800;color:#5a4a6a;margin:0 0 6px}
#start .author{background:linear-gradient(90deg,#fff7e0,#fde9ff);border-radius:18px;padding:8px 12px;margin:8px 0;border:2px dashed #e5c0f0}

<script>/* الصف السابع — الحصة 2: الفعل المضارع المرفوع */

 {s:1,type:'mcq',q:'الفعل المضارع هو الفعل الذي يدلّ على حدث مقترن بزمن صالح لـ:',o:['الحال أو الاستقبال','الماضي فقط','الأمر والطلب','الماضي البعيد'],a:0,ex:'الفعل المضارع: هو الذي يدلّ على حدثٍ مقترنٍ بزمنٍ صالحٍ للحال أو الاستقبال.'},

/* ======================= AUDIO (WebAudio — أصوات وموسيقى أصلية مولّدة برمجيًا) ======================= */
const A = H.audio = {on:true,music:true,ctx:null};
A.init=function(){
  if(A.ctx){ if(A.ctx.state!=='running') A.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=A.ctx=new AC();
  A.master=c.createGain(); A.master.connect(c.destination);
  A.comp=c.createDynamicsCompressor(); A.comp.connect(A.master);
  A.mg=c.createGain(); A.mg.gain.value=0; A.mg.connect(A.comp);
  A.sg=c.createGain(); A.sg.gain.value=.5; A.sg.connect(A.comp);
  const len=c.sampleRate*.5, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1; A.nb=b;
  A.apply(); A.startMusic();
  document.addEventListener('visibilitychange',()=>{ if(!A.ctx) return; document.hidden?A.ctx.suspend():A.ctx.resume(); });
};
A.apply=function(){ if(!A.ctx) return; const t=A.ctx.currentTime;
  A.master.gain.setTargetAtTime(A.on?.9:0,t,.05); A.mg.gain.setTargetAtTime(A.music?.13:0,t,.25); };
A.tone=function(f,dur,type,vol,when,slide,dest){ if(!A.ctx) return; const c=A.ctx,t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.3,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g); g.connect(dest||A.sg); o.start(t); o.stop(t+dur+.05); };
A.noise=function(dur,vol,freq,when,dest,type){ if(!A.ctx) return; const c=A.ctx,t=c.currentTime+(when||0);
  const s=c.createBufferSource(); s.buffer=A.nb; const f=c.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq||1000;
  const g=c.createGain(); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||A.sg); s.start(t); s.stop(t+dur+.05); };
const N=m=>440*Math.pow(2,(m-69)/12);
A.sfx={
  jump(){A.tone(330,.22,'square',.12,0,760);},
  coin(){A.tone(988,.08,'square',.1);A.tone(1319,.18,'square',.1,.07);},
  pop(){A.tone(600,.12,'sine',.25,0,1200);},
  correct(){[72,76,79,84].forEach((m,i)=>A.tone(N(m),.28,'triangle',.22,i*.08));A.tone(N(96),.5,'sine',.06,.32);},
  wrong(){A.tone(N(64),.25,'triangle',.18);A.tone(N(60),.4,'triangle',.16,.18);},
  bump(){A.noise(.18,.25,300);A.tone(120,.2,'sine',.25,0,60);},
  whoosh(){A.noise(.45,.18,1500,0,null,'bandpass');},
  stage(){[67,72,76,79,76,79,84].forEach((m,i)=>A.tone(N(m),.3,'square',.08,i*.11));[48,55,60].forEach((m,i)=>A.tone(N(m),.9,'triangle',.15,i*.11));},
  win(){[72,74,76,77,79,81,83,84].forEach((m,i)=>A.tone(N(m),.25,'triangle',.18,i*.07));A.tone(N(84),1.2,'sine',.12,.6);},
  click(){A.tone(800,.05,'square',.06);},
  splash(){A.noise(.35,.2,800);},
};
const SCALES={hijaz:[0,1,4,5,7,8,10],ajam:[0,2,4,5,7,9,11],nahawand:[0,2,3,5,7,8,10],kurd:[0,1,3,5,7,8,10],pent:[0,2,4,7,9]};
A.startMusic=function(){
  const cfg=Object.assign({bpm:100,root:62,scale:'ajam',seed:1,lead:'triangle'},H.cfg.music||{});
  let seed=cfg.seed*9301+49297; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const sc=SCALES[cfg.scale]||SCALES.ajam, deg=d=>cfg.root+12*Math.floor(d/sc.length)+sc[((d%sc.length)+sc.length)%sc.length];
  const mkBar=()=>{const bar=[];let d=Math.floor(rnd()*5)+2;for(let i=0;i<8;i++){ if(rnd()<.22&&i%2){bar.push(null);continue;} d+=Math.round((rnd()-.5)*3.2); d=clamp(d,0,9); bar.push(d);} return bar;};
  const Abar=mkBar(),Bbar=mkBar(),Cbar=mkBar(),Dbar=mkBar(); const end=[4,null,2,null,0,null,null,null];
  const song=[Abar,Bbar,Abar,Cbar,Dbar,Bbar,Abar,end];
  const bass=[0,0,3,4,0,3,4,0];
  const drum='D.T.DTT.'; // مقسوم
  const step=60/cfg.bpm/2; let nextT=A.ctx.currentTime+.1, i=0;
  setInterval(()=>{ if(!A.ctx||A.ctx.state!=='running') {nextT=A.ctx?A.ctx.currentTime+.1:0;return;}
    while(nextT<A.ctx.currentTime+.25){ const bar=song[(i>>3)%song.length], s=i%8, when=nextT-A.ctx.currentTime;
      const n=bar[s]; if(n!=null){ A.tone(N(deg(n)+12),step*1.7,cfg.lead,.16,when,null,A.mg); A.tone(N(deg(n)+24),step*.9,'sine',.04,when,null,A.mg);}
      if(s===0||s===4){ A.tone(N(deg(bass[(i>>3)%8])-12),step*3,'triangle',.22,when,null,A.mg);}
      const dc=drum[s]; if(dc==='D'){A.tone(95,.18,'sine',.5,when,50,A.mg);} else if(dc==='T'){A.noise(.06,.18,3200,when,A.mg,'highpass');}
      nextT+=step; i++; }
  },60);
};

H.rr=function(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
H.font=(sz,w)=>`${w||800} ${sz}px Cairo, Tajawal, 'Geeza Pro', Tahoma, sans-serif`;
H.wrap=function(c,text,maxW){ const words=String(text).split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(c.measureText(t).width>maxW&&line){lines.push(line);line=w;} else line=t; }
  if(line) lines.push(line); return lines; };
/* لافتة نصية عربية مركزية مع خلفية */
H.label=function(c,text,x,y,o){ o=o||{}; const sz=o.size||32; c.save(); c.font=H.font(sz,o.weight); c.direction='rtl'; c.textAlign='center'; c.textBaseline='middle';
  const lines=H.wrap(c,text,o.maxW||400); const lh=sz*1.32; let w=0; lines.forEach(l=>w=Math.max(w,c.measureText(l).width));
  const pad=o.pad==null?14:o.pad, bw=w+pad*2, bh=lines.length*lh+pad*1.1;
  if(o.bg){ c.fillStyle=o.bg; if(o.shadow!==false){c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=10;c.shadowOffsetY=4;} H.rr(c,x-bw/2,y-bh/2,bw,bh,o.radius==null?18:o.radius); c.fill(); c.shadowColor='transparent';
    if(o.border){c.lineWidth=o.borderW||4;c.strokeStyle=o.border;c.stroke();} }
  lines.forEach((l,i)=>{ const ly=y-(lines.length-1)*lh/2+i*lh; if(o.stroke){c.lineWidth=o.strokeW||6;c.strokeStyle=o.stroke;c.lineJoin='round';c.strokeText(l,x,ly);} c.fillStyle=o.color||'#1d1630'; c.fillText(l,x,ly); });
  c.restore(); return {w:bw,h:bh}; };

/* ---------- الشخصية: طالب عُماني بالدشداشة والكُمّة (رسم برمجي متحرك) ---------- */
const SKIN='#f1c49c',SKIN_D='#d9a277',ROBE='#fbfbf7',ROBE_D='#d9dee6',HAIR='#2a1c14';
function kumma(c,hx,hy,r,back){ // الكُمّة العُمانية المطرّزة
  c.save(); c.beginPath(); c.ellipse(hx,hy-r*.38,r*1.02,r*.78,0,Math.PI,0); c.lineTo(hx+r*1.02,hy-r*.30); c.lineTo(hx-r*1.02,hy-r*.30); c.closePath();
  const g=c.createLinearGradient(hx,hy-r*1.2,hx,hy-r*.3); g.addColorStop(0,'#fffdf5'); g.addColorStop(1,'#efe6d2'); c.fillStyle=g; c.fill();
  c.lineWidth=r*.06; c.strokeStyle='#c9b78f'; c.stroke(); c.clip();
  const cols=['#8a1c3b','#c8962a','#2f7d5b','#1f4e8c'];
  for(let row=0;row<4;row++){ const yy=hy-r*.42-row*r*.2; for(let k=-6;k<=6;k++){ const xx=hx+k*r*.19+(row%2)*r*.095;
    c.fillStyle=cols[(k+row+8)%cols.length]; c.beginPath(); c.moveTo(xx,yy-r*.07); c.lineTo(xx+r*.06,yy); c.lineTo(xx,yy+r*.07); c.lineTo(xx-r*.06,yy); c.fill(); } }
  c.fillStyle='#8a1c3b'; c.fillRect(hx-r*1.1,hy-r*.40,r*2.2,r*.07);
  c.restore();
}
H.drawBoy=function(c,x,y,s,o){
  o=o||{}; const t=o.t||0, pose=o.pose||'stand', face=o.face||'happy';
  c.save(); c.translate(x,y); c.scale(s*(o.flip?-1:1),s);
  const back=o.view==='back';
  let legA=0,armA=0,bob=0,armUp=0;
  if(pose==='run'){ legA=Math.sin(t*14)*.6; armA=-Math.sin(t*14)*.7; bob=Math.abs(Math.sin(t*14))*-3; }
  else if(pose==='jump'){ legA=.5; armUp=1; }
  else if(pose==='cheer'){ armUp=1; bob=Math.abs(Math.sin(t*8))*-6; }
  else if(pose==='climb'){ armUp=.6+Math.sin(t*10)*.4; legA=Math.sin(t*10)*.5; }
  else if(pose==='swim'){ legA=Math.sin(t*10)*.5; armA=Math.sin(t*10)*.4; }
  else if(pose==='sit'){ legA=1.3; }
  else { bob=Math.sin(t*3)*1.2; }
  c.translate(0,bob);
  // ظل
  if(o.shadow!==false){ c.save(); c.translate(0,-bob); c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0,1,20,5,0,0,7); c.fill(); c.restore(); }
  // الساقان والصندل
  const leg=(a,dx)=>{ c.save(); c.translate(dx,-20); c.rotate(a); c.fillStyle=SKIN_D; c.fillRect(-3.2,0,6.4,17); c.fillStyle='#6b3e1f'; H.rr(c,-5,15,13,5,2.5); c.fill(); c.restore(); };
  leg(legA,-6); leg(-legA,6);
  // الذراع الخلفية
  const arm=(a,dx,front)=>{ c.save(); c.translate(dx,-60); const up=armUp*(front?-2.3:2.3); c.rotate(a+up);
    c.fillStyle=front?ROBE:'#eceff3'; H.rr(c,-5,0,10,26,5); c.fill(); c.strokeStyle=ROBE_D; c.lineWidth=1.2; c.stroke();
    c.fillStyle=SKIN; c.beginPath(); c.arc(0,28,4.6,0,7); c.fill(); c.restore(); };
  arm(armA,-12,false);
  // الدشداشة
  c.beginPath(); c.moveTo(-14,-64); c.quadraticCurveTo(0,-68,14,-64); c.lineTo(19,-18); c.quadraticCurveTo(0,-14,-19,-18); c.closePath();
  const rg=c.createLinearGradient(-19,0,19,0); rg.addColorStop(0,'#e8ecf2'); rg.addColorStop(.45,ROBE); rg.addColorStop(1,'#e2e7ee'); c.fillStyle=rg; c.fill();
  c.strokeStyle=ROBE_D; c.lineWidth=1.4; c.stroke();
  if(!back){ // الفُرّاخة (الطُّرّة) العُمانية
    c.strokeStyle='#c9b48a'; c.lineWidth=1.6; c.beginPath(); c.moveTo(2,-62); c.lineTo(3,-42); c.stroke();
    c.fillStyle='#d8c08d'; c.beginPath(); c.ellipse(3,-39,2.6,4.6,0,0,7); c.fill();
    c.strokeStyle='#d3d9e2'; c.lineWidth=1; c.beginPath(); c.moveTo(-1,-62); c.lineTo(-1,-50); c.stroke(); }
  if(o.gear==='diving'){ c.fillStyle='#ffb300'; H.rr(c,-17,-56,8,22,3); c.fill(); c.fillStyle='#e85d20'; H.rr(c,-19,-58,8,26,3); c.fill(); }
  // الرقبة والرأس
  c.fillStyle=SKIN_D; c.fillRect(-4,-70,8,8);
  const hx=0,hy=-86,r=21;
  c.fillStyle=SKIN; c.beginPath(); c.arc(hx,hy,r,0,7); c.fill();
  c.fillStyle=HAIR; c.beginPath(); c.ellipse(hx-r*.86,hy-2,4,8,0,0,7); c.fill(); if(back){c.beginPath(); c.ellipse(hx,hy-4,r*.95,r*.8,0,0,Math.PI); c.fill();}
  if(!back){
    c.fillStyle=SKIN; c.beginPath(); c.ellipse(hx-r*.95,hy+2,4,6,0,0,7); c.fill(); // أذن
    const ex1=hx+3, ex2=hx+13, ey=hy+1;
    const eye=(ex,sc)=>{ if(face==='blink'){c.strokeStyle='#2a1c14';c.lineWidth=2;c.beginPath();c.arc(ex,ey,4*sc,0,Math.PI);c.stroke();return;}
      c.fillStyle='#fff'; c.beginPath(); c.ellipse(ex,ey,4.6*sc,6*sc,0,0,7); c.fill();
      c.fillStyle='#4a2c17'; c.beginPath(); c.ellipse(ex+1*sc,ey+.8,3.4*sc,4.6*sc,0,0,7); c.fill();
      c.fillStyle='#120a05'; c.beginPath(); c.arc(ex+1.2*sc,ey+1,1.9*sc,0,7); c.fill();
      c.fillStyle='#fff'; c.beginPath(); c.arc(ex+2.2*sc,ey-1.6*sc,1.4*sc,0,7); c.fill(); c.beginPath(); c.arc(ex-.2,ey+2.4*sc,.7*sc,0,7); c.fill(); };
    eye(ex1,.9); eye(ex2,1.05);
    c.strokeStyle=HAIR; c.lineWidth=2; c.lineCap='round';
    const br=face==='wow'?-3:0; c.beginPath(); c.moveTo(ex1-4,ey-9+br); c.lineTo(ex1+3,ey-10+br); c.moveTo(ex2-3,ey-10+br); c.lineTo(ex2+5,ey-9+br); c.stroke();
    c.fillStyle='rgba(255,120,120,.35)'; c.beginPath(); c.ellipse(hx+17,hy+9,4,2.6,0,0,7); c.fill(); c.beginPath(); c.ellipse(hx,hy+9,3.4,2.2,0,0,7); c.fill();
    c.strokeStyle='#7a3b22'; c.lineWidth=2;
    if(face==='wow'){ c.fillStyle='#7a3b22'; c.beginPath(); c.ellipse(hx+10,hy+13,2.6,3.4,0,0,7); c.fill(); }
    else if(face==='focus'){ c.beginPath(); c.moveTo(hx+6,hy+13); c.lineTo(hx+14,hy+12); c.stroke(); }
    else { c.fillStyle='#8a3b2a'; c.beginPath(); c.arc(hx+10,hy+10,5,0.1,Math.PI-0.1); c.fill(); c.fillStyle='#fff'; c.fillRect(hx+6.5,hy+10,7,1.6); }
  }
  kumma(c,hx,hy,r,back);
  if(o.gear==='diving'&&!back){ c.strokeStyle='#1f6fb2'; c.lineWidth=3; c.fillStyle='rgba(160,220,255,.45)'; H.rr(c,hx-2,hy-8,24,17,7); c.fill(); c.stroke(); c.beginPath(); c.moveTo(hx-2,hy-1); c.lineTo(hx-r,hy-3); c.stroke(); }
  if(o.gear==='helmet'){ c.fillStyle='rgba(30,120,200,.95)'; c.beginPath(); c.ellipse(hx,hy-r*.52,r*1.12,r*.72,0,Math.PI,0); c.fill(); c.fillStyle='#fff'; c.fillRect(hx-3,hy-r*1.2,6,r*.5); }
  if(o.gear==='space'){ c.strokeStyle='rgba(255,255,255,.95)'; c.lineWidth=3; c.fillStyle='rgba(170,220,255,.22)'; c.beginPath(); c.arc(hx,hy-2,r*1.45,0,7); c.fill(); c.stroke();
    c.fillStyle='rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(hx+12,hy-18,6,3,-.6,0,7); c.fill(); }
  arm(-armA,12,true);
  c.restore();
};

const FX = H.fx = {l:[]};
const COLS=['#ffd84d','#ff6b6b','#4dd2ff','#7cf29a','#c77dff','#ff9f1c','#fff'];
FX.burst=function(x,y,n,o){ o=o||{}; for(let i=0;i<(n||30);i++){ const a=rand(0,Math.PI*2),v=rand(o.min||120,o.max||420);
  FX.l.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up||120),g:o.g==null?520:o.g,life:rand(.8,1.6),t:0,s:rand(5,11),c:o.c||pick(COLS),k:o.k||pick(['c','s','r']),rot:rand(0,6),vr:rand(-8,8)}); } };

FX.text=function(x,y,txt,col){ FX.l.push({x,y,vx:0,vy:-90,g:0,life:1.1,t:0,txt,c:col||'#ffd84d',k:'t'}); };
FX.update=function(dt){ for(const p of FX.l){ p.t+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=(p.vr||0)*dt; } FX.l=FX.l.filter(p=>p.t<p.life); };
FX.draw=function(c){ for(const p of FX.l){ const a=1-p.t/p.life; c.save(); c.globalAlpha=clamp(a*1.4,0,1); c.translate(p.x,p.y);
  if(p.k==='t'){ c.font=H.font(34,900); c.textAlign='center'; c.lineWidth=6; c.strokeStyle='rgba(0,0,0,.5)'; c.strokeText(p.txt,0,0); c.fillStyle=p.c; c.fillText(p.txt,0,0); }
  else { c.rotate(p.rot); c.fillStyle=p.c; if(p.k==='c'){c.beginPath();c.arc(0,0,p.s/2,0,7);c.fill();} else if(p.k==='r'){c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);} else { star(c,0,0,p.s*.9,p.s*.4); c.fill(); } }
  c.restore(); } };
function star(c,x,y,R,r){ c.beginPath(); for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} c.closePath(); }

  else if(q.type==='tf'){ q.opts=[{t:'صح ✔',ok:q.a===true},{t:'خطأ ✘',ok:q.a===false}]; }
  else if(q.type==='collect'){ q.opts=shuffle(q.o.map(x=>Object.assign({},x))); }

/* يطلب السؤال التالي. يُرجع null إذا انتهت المرحلة أو إذا كان السؤال يُعرض في «بوابة المعرفة» */

/* يسجّل الإجابة ويعرض التغذية الراجعة */
api.answer=function(ok,x,y,chosen,cb){
  const q=S.cur; if(!q) return; S.mode='feedback'; S.answered++;
  const right=correctText(q);
  S.log.push({q:q.q,ok,chosen,right,ex:q.ex});
  let gain=0;
  if(ok){ S.ok++; S.stars++; S.streak++; S.best=Math.max(S.best,S.streak); gain=100+(S.streak>=3?20*Math.min(S.streak-2,5):0); S.score+=gain;
    A.sfx.correct(); if(x!=null){ FX.burst(x,y,60); FX.text(x,y-40,'+'+gain); }
    if(S.ok===1) badge('🌟 الانطلاقة الأولى'); if(S.streak===3) badge('🔥 سلسلة ثلاثية'); if(S.streak===5) badge('🚀 خمس متتالية'); if(S.streak===8) badge('👑 بطل لا يتوقف'); }
  else { S.bad++; S.streak=0; A.sfx.wrong(); }
  hud(); S.afterFb=cb;
  setTimeout(()=>{
    const fb=$('#fb'); fb.classList.toggle('bad',!ok);
    $('#fEmo').textContent=ok?pick(['🌟','🎉','🏆','👏','🚀']):pick(['🤔','💪','🌱','🙂']);
    $('#fTitle').textContent=ok?pick(GOOD):pick(SOFT);
    $('#fPts').textContent=ok?('+'+gain+' نقطة  ⭐'):'';
    const choice=q.type==='mcq'||q.type==='tf'; $('#fAns').innerHTML=choice?((ok?'✅ ':'💡 الإجابة الصحيحة: ')+escapeH(right)):(ok?'✅ أكملت التحدي دون أخطاء!':'💡 أكملت التحدي ('+escapeH(chosen||'')+') — تأمّل الحل الصحيح:');
    $('#fEx').textContent=q.ex||''; show('#fb'); S.fbShown=true; if(ok) for(let i=0;i<3;i++) setTimeout(()=>FX.firework(rand(V.W*.2,V.W*.8),rand(V.H*.2,V.H*.45)),i*250);
  }, ok?650:450);
};
function correctText(q){ if(q.opts&&(q.type==='mcq'||q.type==='tf')) return q.opts.find(o=>o.ok).t;
  if(q.type==='order') return q.o.join(' ');
  if(q.type==='collect') return q.o.filter(x=>x.ok).map(x=>x.t).join('، ');
  if(q.type==='sort') return q.bins.map((b,i)=>b+': '+q.o.filter(x=>x.b===i).map(x=>x.t).join('، ')).join(' | ');
  if(q.type==='match') return q.o.map(p=>p[0]+' ← '+p[1]).join(' | ');
  return ''; }
function escapeH(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
function contFeedback(){ if(S.mode!=='feedback'||!S.fbShown) return; S.fbShown=false; hide('#fb'); api.hideBanner(); const q=S.cur; S.cur=null; S.mode='play'; I.clear(); A.sfx.click();
  const cb=S.afterFb; S.afterFb=null; cb&&cb(); const st=S.stage; if(!S.queues[st].length) setTimeout(()=>{ if(S.mode==='play'&&!S.cur&&S.stage===st&&!S.queues[st].length) stageEnd(); },700); }

function stageEnd(){

  $('#scSub').textContent=last?'أتممت المغامرة كاملة! لنرَ نتيجتك 🎉':('استعدّ للمرحلة '+(S.stage+2)+': '+STAGES[S.stage+1]+' ⚡');
  $('#bSc').textContent=last?'عرض النتيجة 🏆':'إلى المرحلة التالية ▶';

/* ======================= «بوابة المعرفة»: السحب والإفلات / التوصيل / الترتيب / الجمع ======================= */
function runChallenge(q){
  S.mode='challenge'; A.sfx.whoosh();
  const card=$('#chCard'); let mistakes=0;
  const head=`<h2>🔑 بوابة المعرفة</h2><div class="qt">${escapeH(q.q)}</div><div class="mist" id="chM"></div>`;
  const done=()=>{ setTimeout(()=>{ hide('#ch'); S.mode='play'; api.answer(mistakes===0,V.W/2,V.H/2,mistakes?('عدد الأخطاء: '+mistakes):'',()=>{}); },700); };
  const miss=(e,msg)=>{ mistakes++; A.sfx.wrong(); if(e){ e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); } $('#chM').textContent=msg||'حاول مرة أخرى 💪'; };
  const good=e=>{ A.sfx.coin(); S.score+=20; hud(); $('#chM').textContent=''; };
  if(q.type==='sort'){
    card.innerHTML=head+`<div class="pool" id="pool"></div><div class="bins">${q.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${escapeH(b)}</h3><div class="in"></div></div>`).join('')}</div>`;
    const pool=$('#pool'); let sel=null, left=q.o.length;
    shuffle(q.o).forEach(it=>{ const c=el('div',{class:'chip'},escapeH(it.t)); c._b=it.b; pool.appendChild(c); enableDrag(c); });
    const place=(chip,bin)=>{ if(+bin.dataset.b===chip._b){ chip.classList.remove('sel'); chip.classList.add('ok'); bin.querySelector('.in').appendChild(chip); chip._done=true; good(); left--; if(!left) done(); }
      else miss(chip,'هذه البطاقة لا تنتمي إلى «'+bin.querySelector('h3').textContent+'» — جرّب مكانًا آخر'); sel=null; };
    card.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{ if(sel) place(sel,b); });
    function enableDrag(c){ let ghost=null,ox=0,oy=0,moved=false,sx=0,sy=0;
      c.addEventListener('pointerdown',e=>{ if(c._done) return; e.preventDefault(); A.init(); sx=e.clientX; sy=e.clientY; moved=false; c.setPointerCapture(e.pointerId); const r=c.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; });
      c.addEventListener('pointermove',e=>{ if(c._done||!c.hasPointerCapture(e.pointerId)) return; if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8) return;
        if(!moved){ moved=true; ghost=c.cloneNode(true); ghost.classList.add('drag'); document.body.appendChild(ghost); c.classList.add('dim'); }
        ghost.style.left=(e.clientX-ox)+'px'; ghost.style.top=(e.clientY-oy)+'px';
        card.querySelectorAll('.bin').forEach(b=>{ const r=b.getBoundingClientRect(); b.classList.toggle('hot',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom); }); });
      c.addEventListener('pointerup',e=>{ if(c._done) return; card.querySelectorAll('.bin').forEach(b=>b.classList.remove('hot'));
        if(moved){ ghost&&ghost.remove(); ghost=null; c.classList.remove('dim'); const t=[...card.querySelectorAll('.bin')].find(b=>{const r=b.getBoundingClientRect(); return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;}); if(t) place(c,t); }
        else { if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); A.sfx.click(); } });
      c.addEventListener('pointercancel',()=>{ ghost&&ghost.remove(); ghost=null; c.classList.remove('dim'); }); }
  } else if(q.type==='match'){
    const L=shuffle(q.o.map((p,i)=>({t:p[0],i}))), R=shuffle(q.o.map((p,i)=>({t:p[1],i})));
    card.innerHTML=head+`<div class="hint" style="font-weight:800;color:#0b6aa2;font-size:20px">المس عنصرًا من اليمين ثم ما يناسبه من اليسار</div><div class="match"><div class="col" id="mL"></div><div class="col" id="mR"></div></div>`;
    let sel=null, left=q.o.length;
    L.forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c._i=x.i; c.onclick=()=>{ if(c._done) return; if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); A.sfx.click(); }; $('#mL').appendChild(c); });
    R.forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c._i=x.i; c.onclick=()=>{ if(c._done||!sel) return;

  } else if(q.type==='order'){
    card.innerHTML=head+`<div class="slots" id="sl"></div><div class="pool" id="pool"></div>`;
    let k=0; shuffle(q.o.map((t,i)=>({t,i}))).forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c.onclick=()=>{ if(c._done) return;
      if(x.i===k){ c._done=true; c.classList.add('ok'); $('#sl').appendChild(c); k++; good(); if(k===q.o.length) done(); } else miss(c,'ليست هذه الكلمة التالية'); }; $('#pool').appendChild(c); });
  } else if(q.type==='collect'){
    const need=q.o.filter(x=>x.ok).length; let got=0;
    card.innerHTML=head+`<div class="pool" id="pool"></div>`;
    shuffle(q.o).forEach(x=>{ const c=el('div',{class:'chip'},escapeH(x.t)); c.onclick=()=>{ if(c._done) return; c._done=true;
      if(x.ok){ c.classList.add('ok'); good(); got++; if(got===need) done(); } else { c.classList.add('dim'); miss(c,'«'+x.t+'» ليست من المطلوب'); } }; $('#pool').appendChild(c); });
  } else { // احتياط
    card.innerHTML=head; done();
  }
  show('#ch');
}

function dia(x,cx,cy,r){ x.beginPath(); x.moveTo(cx,cy-r); x.lineTo(cx+r,cy); x.lineTo(cx,cy+r); x.lineTo(cx-r,cy); x.closePath(); x.fill(); }
function star8(x,cx,cy,r,mode){ x.beginPath(); for(let i=0;i<16;i++){ const a=i*Math.PI/8, rr=i%2?r*.72:r; x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);} x.closePath(); mode==='stroke'?x.stroke():x.fill(); }
function flourish(x,cx,cy,w,col){ x.strokeStyle=col; x.lineWidth=4; x.beginPath(); x.moveTo(cx-w/2,cy); x.quadraticCurveTo(cx-w/4,cy-26,cx-40,cy); x.moveTo(cx+w/2,cy); x.quadraticCurveTo(cx+w/4,cy-26,cx+40,cy); x.stroke(); x.fillStyle=col; star8(x,cx,cy,22,'fill'); }

<script>/* اللعبة 10: مغامرة الدرّاج العُماني — الهمزة المتوسطة على الألف (طريق ثلاثي الأبعاد منظوري) */
(function(){
const H=Himam,{rand,clamp,lerp}=H.u;
const SEG=200,RW=2000,DRAW=150,CAMH=1000,DEPTH=0.84,CAMBACK=300;
const LCOL=['#ff6f91','#3fb6ff','#ffc93c','#5ed17a'];
const THEMES=[ // قرية، جبل، ساحل، صحراء
 {sky:['#8fd3ff','#fff1d6'],grass:['#7cc36a','#6db35c'],far:'#b7c7a3',sun:'#fff6c8',side:'village'},
 {sky:['#6fb6ff','#dff2ff'],grass:['#9a7b55','#8a6b47'],far:'#8a6a5a',sun:'#fffbe0',side:'mountain'},
 {sky:['#4fb3ff','#c7f0ff'],grass:['#e9d29a','#dcc386'],far:'#6aa6c9',sun:'#ffffff',side:'coast'},
 {sky:['#ff9a62','#ffe1a8'],grass:['#f0b35a','#e6a74b'],far:'#d9884a',sun:'#fff0b0',side:'desert'}];
const G={supports:['mcq','tf'],t:0};
let api,V,pos=0,speed=0,px=0,tx=null,h=0,vh=0,stage=0,bg=0,hurt=0,cheer=0,face='happy';
let objs=[],gate=null,nextObjZ=3000,lastGateZ=0;
const curveAt=i=>Math.sin(i*.011)*1.9*Math.max(0,Math.sin(i*.0047+1.2));
const hillAt=i=>Math.sin(i*.018)*500+Math.sin(i*.0061+2)*800;
function hillZ(z){ const i=Math.floor(z/SEG),f=z/SEG-i; return lerp(hillAt(i),hillAt(i+1),f); }
G.init=a=>{api=a;V=H.view;};
G.reset=s=>{ stage=s||0; pos=0; speed=0; px=0; tx=null; h=vh=0; objs=[]; gate=null; nextObjZ=3000; lastGateZ=0; };
G.onStage=s=>{ stage=s; H.audio.sfx.whoosh(); };
G.hint=()=>'⬅ ➡ انتقل إلى مسار الإجابة الصحيحة (طابق اللون) — ⤒ للقفز فوق العوائق';
let proj=[],zb=800,pZ=0,horizon=270;
function laneOf(n){ return clamp(Math.floor((px+1)/2*n),0,n-1); }
G.update=(dt,I)=>{
  G.t+=dt; V=H.view; horizon=Math.max(V.H*.45,V.top+80); const yb=V.H-V.bot-30; zb=DEPTH*CAMH*(V.H/2)/Math.max(40,yb-horizon); pZ=pos-CAMBACK+zb;
  const demo=api.demo;
  let target=demo?1500:(1700+stage*200); if(gate&&!gate.done) target=780; if(hurt>0) target*=.5; speed=lerp(speed,target,dt*1.5);
  pos+=speed*dt; bg-=curveAt(Math.floor(pos/SEG))*speed*dt*.0009;
  if(demo){ px=Math.sin(G.t*.6)*.5; return; }
  // التوجيه
  const steer=(I.right?1:0)-(I.left?1:0);
  if(steer){ px+=steer*dt*1.7; tx=null; }
  for(const sw of I.swipes.splice(0)){ const n=gate&&!gate.done?gate.q.opts.length:3; const lw=2/n; const cur=laneOf(n);
    if(sw==='left') tx=-1+lw*(Math.max(0,cur-1)+.5); else if(sw==='right') tx=-1+lw*(Math.min(n-1,cur+1)+.5); else if(sw==='up') doJump(); }
  for(const tp of I.taps.splice(0)){ if(tp.y<V.top) continue; const n=gate&&!gate.done?gate.q.opts.length:3; const k=clamp(Math.floor(tp.x/V.W*n),0,n-1); tx=-1+2/n*(k+.5); }
  if(tx!=null){ px=lerp(px,tx,dt*6); if(Math.abs(px-tx)<.01) tx=null; }
  px=clamp(px,-.95,.95);
  if(I.edge('jump')||I.edge('up')) doJump();
  vh-=1900*dt; h=Math.max(0,h+vh*dt); if(h===0) vh=0;
  hurt-=dt; cheer-=dt;
  // سؤال جديد
  if(!gate&&api.canAsk()&&pos>lastGateZ+2500){ const q=api.next(); if(q){ gate={q,z:pZ+6200,done:false}; objs=objs.filter(o=>o.z<gate.z-1600||o.z>gate.z+400); } }
  if(gate&&!gate.done&&pZ>=gate.z){ gate.done=true; const n=gate.q.opts.length,k=laneOf(n); gate.pick=k; const ok=gate.q.opts[k].ok; face=ok?'happy':'wow'; cheer=ok?2:0;
    api.answer(ok,V.W/2,V.H*.5,gate.q.opts[k].t,()=>{ lastGateZ=pos; }); }
  if(gate&&gate.done&&gate.z<pZ-1500) gate=null;
  // عوائق وتمور
  while(nextObjZ<pZ+DRAW*SEG*.8){ const z=nextObjZ; nextObjZ+=rand(700,1300);
    if(gate&&!gate.done&&z>gate.z-1800&&z<gate.z+300) continue;
    if(Math.random()<.45+stage*.05) objs.push({k:pick(['rock','goat','barrel']),z,x:pick([-.66,0,.66])});
    else for(let j=0;j<4;j++) objs.push({k:'date',z:z+j*160,x:pick([-.66,0,.66])+0});
  }
  for(const o of objs){ if(o.hit) continue; if(Math.abs(o.z-pZ)<110&&Math.abs(o.x-px)<.24){
    if(o.k==='date'){ if(h<120){ o.hit=1; H.audio.sfx.coin(); api.addPoints(10,V.W/2,V.H-V.bot-160); } }
    else if(h<40&&hurt<=0){ o.hit=1; hurt=1; H.audio.sfx.bump(); H.toast(o.k==='goat'?'تمهّل! ماعز عُماني 🐐':'انتبه للعائق! ⤒ اقفز'); } } }
  objs=objs.filter(o=>o.z>pZ-400&&!(o.hit&&o.k==='date'));
};
const pick=H.u.pick;
function doJump(){ if(h<=0){ vh=820; H.audio.sfx.jump(); } }
function quad(c,x1,y1,w1,x2,y2,w2,col){ c.fillStyle=col; c.beginPath(); c.moveTo(x1-w1,y1); c.lineTo(x2-w2,y2); c.lineTo(x2+w2,y2); c.lineTo(x1+w1,y1); c.closePath(); c.fill(); }
G.render=(c)=>{
  V=H.view; const W=V.W,HH=V.H,th=THEMES[stage]; horizon=Math.max(HH*.45,V.top+80);
  // السماء والخلفية
  const g=c.createLinearGradient(0,0,0,horizon); g.addColorStop(0,th.sky[0]); g.addColorStop(1,th.sky[1]); c.fillStyle=g; c.fillRect(0,0,W,horizon+2);
  c.fillStyle=th.sun; c.beginPath(); c.arc(W*.75+bg*40%W,horizon*.45,40,0,7); c.fill();
  c.fillStyle=th.far; c.beginPath(); c.moveTo(0,horizon+2); for(let x=0;x<=W+30;x+=30){ const wx=x+bg*200; c.lineTo(x,horizon-40-Math.abs(Math.sin(wx*.006))*90-Math.sin(wx*.017)*25); } c.lineTo(W,horizon+2); c.fill();
  if(th.side==='coast'){ c.fillStyle='#2e8fd1'; c.fillRect(0,horizon-12,W,14); }
  c.fillStyle=th.grass[0]; c.fillRect(0,horizon,W,HH-horizon);
  // الطريق
  const base=Math.floor(pos/SEG),off=pos%SEG,camX=px*RW*.85,camY=CAMH+hillZ(pos-CAMBACK+zb);
  let x=0,dx=-curveAt(base)*(off/SEG),maxy=HH; proj.length=0;
  const gz=gate&&!gate.done?gate.z:null, n=gate?gate.q.opts.length:3;
  for(let k=0;k<DRAW;k++){ const i=base+k, z1=k*SEG-off+CAMBACK, z2=z1+SEG; if(z1<=1) { proj.push(null); x+=dx; dx+=curveAt(i); continue; }
    const s1=DEPTH/z1,s2=DEPTH/z2;
    const X1=W/2+s1*(x-camX)*W/2, Y1=horizon+s1*(camY-hillAt(i))*HH/2, W1=s1*RW*W/2;
    const X2=W/2+s2*(x+dx-camX)*W/2, Y2=horizon+s2*(camY-hillAt(i+1))*HH/2, W2=s2*RW*W/2;
    proj.push({X:X1,Y:Y1,W:W1,s:s1,clip:maxy,i,x});
    x+=dx; dx+=curveAt(i);
    if(Y2>=maxy||Y1<=Y2-1e9) continue;
    const alt=(i>>1)%2, wz=i*SEG;
    quad(c,X1,Y1,W1*3.2,X2,Y2,W2*3.2,alt?th.grass[0]:th.grass[1]);
    quad(c,X1,Y1,W1*1.12,X2,Y2,W2*1.12,alt?'#d33':'#fff');
    quad(c,X1,Y1,W1,X2,Y2,W2,alt?'#5b5b66':'#55555f');
    if(gz&&wz<gz&&wz>gz-SEG*34){ for(let L=0;L<n;L++){ const a=-1+2*L/n,b=-1+2*(L+1)/n, cx1=X1+W1*(a+b)/2,cx2=X2+W2*(a+b)/2, hw1=W1*(b-a)/2*.86,hw2=W2*(b-a)/2*.86;
        c.globalAlpha=alt?.55:.42; quad(c,cx1,Y1,hw1,cx2,Y2,hw2,LCOL[L]); c.globalAlpha=1; } }
    else if(alt){ for(const lx of [-1/3,1/3]) quad(c,X1+W1*lx,Y1,W1*.02,X2+W2*lx,Y2,W2*.02,'#f4f4f4'); }
    maxy=Y2; }
  // الأجسام من الأبعد إلى الأقرب
  const items=[];
  for(let k=DRAW-1;k>=1;k--){ const p=proj[k]; if(!p) continue; const i=p.i;
    const side=sideSprite(i); if(side) items.push({p,ox:side.x,k:side.k,z:k}); }
  for(const o of objs){ const k=Math.floor((o.z-(base*SEG))/SEG); const p=proj[k]; if(p) items.push({p,ox:o.x,k:o.k,z:k,o}); }
  if(gate){ const k=Math.floor((gate.z-base*SEG)/SEG); const p=proj[k]; if(p) items.push({p,k:'gate',z:k}); }
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){ const p=it.p; if(p.Y>p.clip+2&&it.k!=='gate') continue; const sx=p.X+p.W*(it.ox||0), sc=p.W/RW;
    c.save(); c.beginPath(); c.rect(0,0,W,p.clip); c.clip(); drawSprite(c,it.k,sx,p.Y,sc,p); c.restore(); }
  // اللافتات العلوية
  if(gate&&!gate.done){ const cw=W/n, sz=n>3?27:30; c.font=H.font(sz); let mh=0; const ls=gate.q.opts.map(o=>H.wrap(c,o.t,cw-60).length); mh=Math.max(...ls)*sz*1.32+16;
    const cy=Math.max(V.top+12,horizon-140)+mh/2;
    for(let L=0;L<n;L++){ const cx=cw*(L+.5); const act=laneOf(n)===L;
      const r=H.label(c,gate.q.opts[L].t,cx,cy,{size:sz,maxW:cw-60,bg:act?'#fffbe6':'rgba(255,255,255,.93)',border:LCOL[L],borderW:act?9:5,radius:16});
      c.fillStyle=LCOL[L]; c.beginPath(); c.moveTo(cx-14,cy+mh/2+4); c.lineTo(cx+14,cy+mh/2+4); c.lineTo(cx,cy+mh/2+24); c.fill(); } }
  drawRider(c,W/2+(px-(px*0.85))*0,V.H-V.bot-30-h*.55);
};
function sideSprite(i){ const th=THEMES[stage].side, r=(i*928371)%97;
